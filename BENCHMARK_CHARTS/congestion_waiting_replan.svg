      <circle cx="606" cy="226.1" r="5" fill="#dd6b20" stroke="#fff" stroke-width="1.5" />
      <text x="606" y="410" fill="#cbd5e0" font-size="12" text-anchor="middle">8 AGVs</text>
    
      <circle cx="740" cy="102.89999999999998" r="5" fill="#e53e3e" stroke="#fff" stroke-width="1.5" />
