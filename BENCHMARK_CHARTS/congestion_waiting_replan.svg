    <text x="400" y="50" fill="#a0aec0" font-size="11" text-anchor="middle">Demonstrates spatial queueing accumulation and localized yielding at higher AGV densities</text>
    
    <line x1="70" y1="390" x2="740" y2="390" stroke="#2a3342" stroke-dasharray="4" /><text x="60" y="394" fill="#e53e3e" font-size="11" text-anchor="end" font-family="monospace">0 ticks</text><line x1="70" y1="324" x2="740" y2="324" stroke="#2a3342" stroke-dasharray="4" /><text x="60" y="328" fill="#e53e3e" font-size="11" text-anchor="end" font-family="monospace">10 ticks</text><line x1="70" y1="258" x2="740" y2="258" stroke="#2a3342" stroke-dasharray="4" /><text x="60" y="262" fill="#e53e3e" font-size="11" text-anchor="end" font-family="monospace">20 ticks</text><line x1="70" y1="192" x2="740" y2="192" stroke="#2a3342" stroke-dasharray="4" /><text x="60" y="196" fill="#e53e3e" font-size="11" text-anchor="end" font-family="monospace">30 ticks</text><line x1="70" y1="126" x2="740" y2="126" stroke="#2a3342" stroke-dasharray="4" /><text x="60" y="130" fill="#e53e3e" font-size="11" text-anchor="end" font-family="monospace">40 ticks</text><line x1="70" y1="60" x2="740" y2="60" stroke="#2a3342" stroke-dasharray="4" /><text x="60" y="64" fill="#e53e3e" font-size="11" text-anchor="end" font-family="monospace">50 ticks</text><text x="750" y="394" fill="#dd6b20" font-size="11" text-anchor="start" font-family="monospace">0 replans</text><text x="750" y="311.5" fill="#dd6b20" font-size="11" text-anchor="start" font-family="monospace">30 replans</text><text x="750" y="229" fill="#dd6b20" font-size="11" text-anchor="start" font-family="monospace">60 replans</text><text x="750" y="146.5" fill="#dd6b20" font-size="11" text-anchor="start" font-family="monospace">90 replans</text><text x="750" y="64" fill="#dd6b20" font-size="11" text-anchor="start" font-family="monospace">120 replans</text>
    <polyline points="70,390 204,389.45 338,354.25 472,289.075 606,226.1 740,94.64999999999998" fill="none" stroke="#dd6b20" stroke-width="3" />
    <polyline points="70,390 204,390 338,385.38 472,377.46 606,318.71999999999997 740,102.89999999999998" fill="none" stroke="#e53e3e" stroke-width="3" />

    
      <circle cx="70" cy="390" r="5" fill="#e53e3e" stroke="#fff" stroke-width="1.5" />
      <circle cx="70" cy="390" r="5" fill="#dd6b20" stroke="#fff" stroke-width="1.5" />
      <text x="70" y="410" fill="#cbd5e0" font-size="12" text-anchor="middle">1 AGVs</text>
    
