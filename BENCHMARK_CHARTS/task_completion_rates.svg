xt-anchor="middle">1 AGVs</text><rect x="190" y="274.5" width="28" height="115.49999999999999" fill="#38a169" rx="3" opacity="0.8" /><text x="204" y="268.5" fill="#48bb78" font-size="11" font-weight="600" text-anchor="middle">7</text><text x="204" y="410" fill="#cbd5e0" font-size="12" text-anchor="middle">2 AGVs</text><rect x="324" y="258" width="28" height="132" fill="#38a169" rx="3" opacity="0.8" /><text x="338" y="252" fill="#48bb78" font-size="11" font-weight="600" text-anchor="middle">8</text><text x="338" y="410" fill="#cbd5e0" font-size="12" text-anchor="middle">4 AGVs</text><rect x="458" y="225" width="28" height="165" fill="#38a169" rx="3" opacity="0.8" /><text x="472" y="219" fill="#48bb78" font-size="11" font-weight="600" text-anchor="middle">10</text><text x="472" y="410" fill="#cbd5e0" font-size="12" text-anchor="middle">6 AGVs</text><rect x="592" y="175.5" width="28" height="214.5" fill="#38a169" rx="3" opacity="0.8" /><text x="606" y="169.5" fill="#48bb78" font-size="11" font-weight="600" text-anchor="middle">13</text><text x="606" y="410" fill="#cbd5e0" font-size="12" text-anchor="middle">8 AGVs</text><rect x="726" y="126" width="28" height="264" fill="#38a169" rx="3" opacity="0.8" /><text x="740" y="120" fill="#48bb78" font-size="11" font-weight="600" text-anchor="middle">16</text><text x="740" y="410" fill="#cbd5e0" font-size="12" text-anchor="middle">10 AGVs</text>
